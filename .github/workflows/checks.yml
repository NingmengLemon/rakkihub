name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧跑批直接取消，队列里只留最新一次
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # 取全历史，spotless 的 ratchet 基点要在提交之间比较
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      # 与每日构建保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Spotless
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::notice::手动触发没有可靠的格式基点，跳过 spotlessCheck"
            exit 0
          fi
          if [ "$EVENT" = "push" ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "::notice::没有可用的 before 提交（首次推送或强推），跳过 spotlessCheck"
              exit 0
            fi
            # 默认的 ratchet 基点是 origin/main，push 时它已经等于 HEAD；改指到本次推送之前的
            # 提交，检查的才是刚推上去的改动，而不是空集。PR 的 origin/main 本来就是基线。
            git update-ref refs/remotes/origin/main "$BEFORE"
          fi
          ./gradlew spotlessCheck

      - name: JVM tests
        run: ./gradlew :app:testGithubDebugUnitTest :ai:testDebugUnitTest :workspace:testDebugUnitTest --continue --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 7
